name: SGX Screener Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: "How many years of history to backtest"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas numpy plotly

      - name: Run backtest
        run: |
          mkdir -p docs
          python backtest.py --years ${{ github.event.inputs.years }} --csv backtest_trades.csv --out docs/backtest.html

      - name: Archive dated snapshot
        run: |
          mkdir -p docs/archive
          cp docs/backtest.html "docs/archive/backtest-$(date -u +'%Y-%m-%d_%H%M').html"
          python build_archive_index.py --archive-dir docs/archive

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/backtest.html docs/archive backtest_trades.csv
          git diff --quiet --cached || git commit -m "Backtest run $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
