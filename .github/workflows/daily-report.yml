name: Daily SGX Watchlist

on:
  schedule:
    # Runs 23:30 UTC = 07:30 SGT, before Singapore market open (09:00 SGT)
    - cron: "30 23 * * 0-4"   # Sun-Thu UTC covers Mon-Fri SGT mornings
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas numpy mplfinance matplotlib

      - name: Run screener
        run: python sgx_screener.py

      - name: Build HTML report
        run: |
          mkdir -p docs
          python report_generator.py --out docs/index.html

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html sgx_watchlist.csv
          git diff --quiet --cached || git commit -m "Daily SGX watchlist $(date -u +'%Y-%m-%d')"
          git push
