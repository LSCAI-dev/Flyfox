name: Daily SGX Watchlist

on:
  schedule:
    # Runs 12:00 UTC = 8:00pm SGT, Mon-Fri (after SGX market close)
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas numpy plotly

      - name: Run screener
        run: python sgx_screener.py

      - name: Build HTML report
        run: |
          mkdir -p docs
          python report_generator.py --out docs/index.html

      - name: Archive dated snapshot
        run: |
          mkdir -p docs/archive
          cp docs/index.html "docs/archive/watchlist-$(date -u +'%Y-%m-%d').html"
          python build_archive_index.py --archive-dir docs/archive

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/archive sgx_watchlist.csv
          git diff --quiet --cached || git commit -m "SGX watchlist update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
